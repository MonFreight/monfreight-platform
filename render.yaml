services:
  - type: web
    name: monfreight-cdp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: monfreight-db
          property: connectionString
      # ---- security ----
      - key: SECRET_KEY
        generateValue: true          # cookie-signing secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                  # set in Render dashboard
      - key: ADMIN_PHONE
        sync: false                  # e.g. +61400123456
      # ---- SMS verification (Twilio) ----
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false                  # your Twilio number, e.g. +61480012345
      # ---- backups (Google Drive) ----
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false                  # paste full service-account JSON key
      - key: GDRIVE_FOLDER_ID
        sync: false                  # Drive folder shared with the service account
      - key: BACKUP_TIME_UTC
        value: "17:00"               # 17:00 UTC ≈ 3am Sydney / 1am Ulaanbaatar
      - key: BACKUP_RETENTION_DAYS
        value: "30"
    disk:
      name: monfreight-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

databases:
  - name: monfreight-db
    plan: free
